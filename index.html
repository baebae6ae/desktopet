<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>데스크토펫 · 8비트 바이브코딩 프롬프트 도우미</title>
  <meta name="description" content="귀여운 8비트 펫이 화면을 돌아다니며 무엇을 요청해야 할지 알려주고, 프롬프트를 만들 때마다 코인으로 가챠를 뽑아 캐릭터를 꾸밀 수 있어요." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 캐릭터가 돌아다니는 무대. 브라우저 창(뷰포트) 전체를 덮는다. -->
  <main id="stage" class="stage" aria-label="데스크토펫 놀이터">
    <p class="stage__hint" aria-hidden="true">펫을 클릭해 보세요 &gt;_</p>

    <!-- 미니 놀이터: 확장프로그램에서는 실제 웹페이지의 버튼·이미지·영상 등을
         밟고 올라타지만, 이 페이지는 펫의 "집"이라 그런 구조물이 없다. 그래서
         climb/냠냠/영상관람/타이핑 미니게임이 상호작용할 장식용 구조물을 몇 개
         놓아둔다(실제 링크·기능은 없음, 순수 장식). -->
    <div class="playground" aria-hidden="true">
      <nav class="pg__shelf pg__shelf--1"></nav>
      <nav class="pg__shelf pg__shelf--2"></nav>
      <img class="pg__pic pg__pic--1" alt="" src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMjAiIGhlaWdodD0iOTAiIHZpZXdCb3g9IjAgMCAxMjAgOTAiPjxyZWN0IHdpZHRoPSIxMjAiIGhlaWdodD0iOTAiIGZpbGw9IiMzN2QwZmYiLz48Y2lyY2xlIGN4PSIzMCIgY3k9IjMwIiByPSIxNCIgZmlsbD0iI2ZmZDIzYyIvPjxwYXRoIGQ9Ik0wIDcwIEwzNSA0MCBMNjUgNjUgTDkwIDQ1IEwxMjAgNzUgTDEyMCA5MCBMMCA5MFoiIGZpbGw9IiM1Y2ZmOGYiLz48L3N2Zz4=" />
      <img class="pg__pic pg__pic--2" alt="" src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMjAiIGhlaWdodD0iOTAiIHZpZXdCb3g9IjAgMCAxMjAgOTAiPjxyZWN0IHdpZHRoPSIxMjAiIGhlaWdodD0iOTAiIGZpbGw9IiNmZjZmYTUiLz48cmVjdCB4PSIxNSIgeT0iMTUiIHdpZHRoPSIzMCIgaGVpZ2h0PSIzMCIgZmlsbD0iI2ZmZDIzYyIvPjxyZWN0IHg9IjU1IiB5PSI0NSIgd2lkdGg9IjUwIiBoZWlnaHQ9IjMwIiBmaWxsPSIjMzdkMGZmIi8+PC9zdmc+" />
      <p class="pg__note">오늘도 좋은 하루 보내요!</p>
      <video class="pg__tv" muted loop autoplay playsinline></video>
      <input class="pg__pad" type="text" tabindex="-1" placeholder="메모장" />
    </div>
  </main>

  <div id="live-region" class="sr-only" role="status" aria-live="polite"></div>

  <button
    id="panel-toggle"
    type="button"
    class="panel-toggle"
    aria-expanded="false"
    aria-controls="panel"
  >
    ⚙ 설정
  </button>

  <aside id="panel" class="panel" hidden>
    <header class="app-header">
      <h1>데스크토펫 <span class="app-header__cursor" aria-hidden="true">&gt;_</span></h1>
      <p class="app-header__desc">펫을 클릭하면 질문 위저드가 열려요. 다 답하면 요청 가이드와 함께 프롬프트 생성 사이트로 이동해요.</p>
    </header>

    <div class="tabs" role="tablist">
      <button class="tab" id="tab-settings" data-tab="settings" aria-selected="true">설정</button>
      <button class="tab" id="tab-gacha" data-tab="gacha" aria-selected="false">
        가챠 <span class="tab__coins" id="tab-coins">🪙 0</span>
      </button>
    </div>

    <section id="view-settings" class="view">
      <label class="row">
        <span>캐릭터</span>
        <select id="species">
          <option value="cat">고양이</option>
          <option value="robot">로봇</option>
          <option value="ghost">유령</option>
          <option value="slime">슬라임</option>
          <option value="bear">곰돌이</option>
        </select>
      </label>
      <label class="row">
        <span>펫 이름</span>
        <input type="text" id="pet-name" maxlength="12" placeholder="이름 지어주기" />
      </label>
      <div class="row">
        <span>애정도</span>
        <span class="affection" id="affection">♥ 0 · Lv.1</span>
      </div>
      <p class="hint" id="hint"></p>

      <a class="site" href="https://nocalhostmore.vercel.app/" target="_blank" rel="noopener">
        프롬프트 생성 사이트 열기 →
      </a>

      <footer class="app-footer">
        <p>펫을 <b>클릭</b>하면 질문이 시작돼요. <b>드래그</b>로 옮길 수 있어요.<br />프롬프트를 생성할 때마다 코인을 받아요!</p>
        <p class="app-footer__note">⚠️ 캐릭터/코인/가챠 데이터는 <strong>이 브라우저의 localStorage</strong>에만 저장돼요. 다른 기기·브라우저에서는 보이지 않아요.</p>
      </footer>
    </section>

    <section id="view-gacha" class="view" hidden>
      <div class="gacha-head">
        <div class="gacha-coins">🪙 <b id="coin-balance">0</b></div>
        <button class="gacha-pull" id="pull-btn">가챠 뽑기 <span id="pull-cost">(50 🪙)</span></button>
      </div>
      <p class="pity-meter" id="pity-meter"></p>
      <p class="hint" id="gacha-hint"></p>

      <div class="pullstage" id="pullstage" hidden>
        <div class="pullstage__flash"></div>
        <div class="pullstage__rays"></div>
        <div class="pullstage__particles" id="particles"></div>
        <div class="pullstage__card" id="pullcard">
          <div class="pullstage__icon" id="pull-icon"></div>
          <div class="pullstage__name" id="pull-name"></div>
          <div class="pullstage__rarity" id="pull-rarity"></div>
        </div>
      </div>

      <h2 class="gacha-sub">보관함 · 장착</h2>
      <div class="slots" id="slots"></div>
    </section>
  </aside>

  <script src="web-shim.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
